<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaelor — The Arcane Tome</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: 'EB Garamond', serif;
        background:
            radial-gradient(ellipse at top left, rgba(80,50,20,0.25), transparent 60%),
            radial-gradient(ellipse at bottom right, rgba(60,35,15,0.3), transparent 60%),
            #e9d9b3;
        color: #3b2a18;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background-blend-mode: multiply;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
            repeating-radial-gradient(circle at 20% 30%, rgba(90,60,20,0.05) 0, transparent 3px),
            repeating-radial-gradient(circle at 70% 80%, rgba(90,60,20,0.05) 0, transparent 4px),
            repeating-radial-gradient(circle at 50% 50%, rgba(60,40,10,0.04) 0, transparent 2px);
        mix-blend-mode: multiply;
    }

    header {
        padding: 18px 28px;
        border-bottom: 3px double #7a5a2e;
        background: linear-gradient(180deg, #d9c294, #c9ad74);
        display: flex;
        align-items: center;
        gap: 16px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        z-index: 1;
    }

    #orb {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #7fe89a, #1e5c33);
        box-shadow: 0 0 8px 2px rgba(60,180,100,0.5);
        flex-shrink: 0;
        transition: box-shadow 0.3s ease;
    }

    #orb.thinking {
        animation: breathe 1.4s ease-in-out infinite;
    }

    #orb.offline {
        background: radial-gradient(circle at 35% 35%, #e88a7f, #5c1e1e);
        box-shadow: 0 0 8px 2px rgba(220,60,60,0.5);
    }

    @keyframes breathe {
        0%, 100% {
            transform: scale(0.85);
            box-shadow: 0 0 10px 3px rgba(60,220,100,0.5);
        }
        50% {
            transform: scale(1.25);
            box-shadow: 0 0 28px 12px rgba(60,220,100,0.9);
        }
    }

    header h1 {
        margin: 0;
        font-family: 'Cinzel Decorative', serif;
        font-size: 1.4rem;
        color: #4a2f10;
        letter-spacing: 1px;
        text-shadow: 0 1px 0 rgba(255,255,255,0.3);
    }

    header p {
        margin: 2px 0 0;
        font-size: 0.85rem;
        color: #6b4a20;
        font-style: italic;
    }

    #layout {
        flex: 1;
        display: flex;
        min-height: 0;
        z-index: 1;
    }

    #sidebar {
        width: 280px;
        flex-shrink: 0;
        background: linear-gradient(180deg, #dccb9c, #cbb47f);
        border-right: 3px double #7a5a2e;
        padding: 20px 16px;
        overflow-y: auto;
    }

    #sidebar h2 {
        font-family: 'Cinzel Decorative', serif;
        font-size: 0.85rem;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #4a2f10;
        margin: 0 0 10px;
        padding-bottom: 6px;
        border-bottom: 1px solid #7a5a2e;
    }

    .sidebar-section {
        margin-bottom: 24px;
    }

    .status-row {
        display: flex;
        justify-content: space-between;
        font-size: 0.85rem;
        margin-bottom: 6px;
        color: #3b2a18;
    }

    .status-row span:last-child {
        font-weight: 600;
    }

    .status-online { color: #1e5c33; }
    .status-offline { color: #7a1f1f; }

    .tool-card {
        background: rgba(244,232,207,0.6);
        border: 1px solid #a9895a;
        border-radius: 4px;
        padding: 8px 10px;
        margin-bottom: 8px;
        font-size: 0.82rem;
    }

    .tool-card .tool-name {
        font-weight: 700;
        color: #3b2a18;
    }

    .tool-card .tool-badge {
        display: inline-block;
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 1px 6px;
        border-radius: 3px;
        margin-left: 6px;
    }

    .badge-readonly {
        background: #d3e8d5;
        color: #1e5c33;
    }

    .badge-approval {
        background: #f0d5b0;
        color: #8a5a1a;
    }

    .tool-card .tool-desc {
        margin-top: 4px;
        color: #5a4526;
        line-height: 1.4;
    }

    #refreshBtn {
        width: 100%;
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #4a2f10;
        background: linear-gradient(180deg, #5c3d1a, #3b2a18);
        color: #e9d9b3;
        font-family: 'EB Garamond', serif;
        font-size: 0.85rem;
        cursor: pointer;
        margin-top: 8px;
    }

    #refreshBtn:hover {
        background: linear-gradient(180deg, #6e4a20, #4a3520);
    }

    #mainColumn {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    #chat {
        flex: 1;
        overflow-y: auto;
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 18px;
    }

    .msg {
        max-width: 72%;
        padding: 14px 18px;
        border-radius: 4px;
        line-height: 1.6;
        white-space: pre-wrap;
        font-size: 1.05rem;
        box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        border: 1px solid #a9895a;
    }

    .user {
        align-self: flex-end;
        background: linear-gradient(180deg, #f0e2bd, #e2cfa0);
        color: #3b2a18;
    }

    .vaelor {
        align-self: flex-start;
        background: linear-gradient(180deg, #ecdcb0, #dcc793);
        color: #2f2210;
        border-left: 4px solid #7a5a2e;
    }

    .tag {
        display: block;
        font-family: 'Cinzel Decorative', serif;
        font-size: 0.65rem;
        color: #7a5a2e;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    #inputBar {
        display: flex;
        padding: 20px;
        border-top: 3px double #7a5a2e;
        background: linear-gradient(180deg, #c9ad74, #d9c294);
        gap: 12px;
    }

    #inputBox {
        flex: 1;
        padding: 14px 18px;
        border-radius: 4px;
        border: 1px solid #7a5a2e;
        background: #f4e8cf;
        color: #3b2a18;
        font-family: 'EB Garamond', serif;
        font-size: 1.05rem;
        outline: none;
    }

    #inputBox:focus {
        border-color: #4a2f10;
        box-shadow: 0 0 0 2px rgba(122,90,46,0.25);
    }

    #sendBtn {
        padding: 12px 26px;
        border-radius: 4px;
        border: 1px solid #4a2f10;
        background: linear-gradient(180deg, #5c3d1a, #3b2a18);
        color: #e9d9b3;
        font-family: 'Cinzel Decorative', serif;
        font-size: 0.9rem;
        letter-spacing: 1px;
        cursor: pointer;
    }

    #sendBtn:hover {
        background: linear-gradient(180deg, #6e4a20, #4a3520);
    }

    #sendBtn:disabled {
        background: #9a8a6a;
        cursor: not-allowed;
    }

    #errorBanner {
        display: none;
        background: #7a1f1f;
        color: #f4e8cf;
        padding: 10px 20px;
        font-size: 0.85rem;
        text-align: center;
    }
</style>
</head>
<body>

<div id="errorBanner"></div>

<header>
    <div id="orb"></div>
    <div>
        <h1>The Tome of Vaelor</h1>
        <p>Prime Magus of the Arcane Tower</p>
    </div>
</header>

<div id="layout">
    <aside id="sidebar">
        <div class="sidebar-section">
            <h2>Archive Status</h2>
            <div class="status-row">
                <span>Connection</span>
                <span id="statusConnection" class="status-offline">Checking...</span>
            </div>
            <div class="status-row">
                <span>Name</span>
                <span id="statusName">—</span>
            </div>
            <div class="status-row">
                <span>Title</span>
                <span id="statusTitle">—</span>
            </div>
        </div>

        <div class="sidebar-section">
            <h2>Available Tools</h2>
            <div id="toolList">
                <p style="font-size:0.82rem; color:#5a4526;">Loading tools...</p>
            </div>
            <button id="refreshBtn">Refresh</button>
        </div>
    </aside>

    <div id="mainColumn">
        <div id="chat"></div>

        <div id="inputBar">
            <input id="inputBox" type="text" placeholder="Speak your query into the tome... (code:, remember:, tool:, or simply ask)" autofocus />
            <button id="sendBtn">Cast</button>
        </div>
    </div>
</div>

<script>
const chat = document.getElementById('chat');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');
const orb = document.getElementById('orb');
const errorBanner = document.getElementById('errorBanner');
const statusConnection = document.getElementById('statusConnection');
const statusName = document.getElementById('statusName');
const statusTitle = document.getElementById('statusTitle');
const toolList = document.getElementById('toolList');
const refreshBtn = document.getElementById('refreshBtn');

function showError(text) {
    errorBanner.textContent = text;
    errorBanner.style.display = 'block';
    console.error('[Vaelor UI]', text);
}

function addMessage(text, sender, tag) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;

    if (tag) {
        const tagEl = document.createElement('span');
        tagEl.className = 'tag';
        tagEl.textContent = tag;
        div.appendChild(tagEl);
    }

    const textNode = document.createElement('span');
    textNode.textContent = text;
    div.appendChild(textNode);

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

async function loadStatus() {
    try {
        const res = await fetch('/health');
        if (!res.ok) throw new Error('status ' + res.status);
        const data = await res.json();

        statusConnection.textContent = 'Online';
        statusConnection.className = 'status-online';
        statusName.textContent = data.name || '—';
        statusTitle.textContent = data.title || '—';
        orb.classList.remove('offline');

    } catch (err) {
        statusConnection.textContent = 'Offline';
        statusConnection.className = 'status-offline';
        orb.classList.add('offline');
    }
}

async function loadTools() {
    toolList.innerHTML = '<p style="font-size:0.82rem; color:#5a4526;">Loading tools...</p>';

    try {
        const res = await fetch('/tools');
        if (!res.ok) throw new Error('status ' + res.status);
        const data = await res.json();
        const tools = data.tools || [];

        if (tools.length === 0) {
            toolList.innerHTML = '<p style="font-size:0.82rem; color:#5a4526;">No tools registered.</p>';
            return;
        }

        toolList.innerHTML = '';

        tools.forEach(function(tool) {
            const card = document.createElement('div');
            card.className = 'tool-card';

            const badgeClass = tool.read_only ? 'badge-readonly' : 'badge-approval';
            const badgeText = tool.read_only ? 'read-only' : 'needs approval';

            card.innerHTML =
                '<span class="tool-name">' + tool.name + '</span>' +
                '<span class="tool-badge ' + badgeClass + '">' + badgeText + '</span>' +
                '<div class="tool-desc">' + tool.description + '</div>';

            toolList.appendChild(card);
        });

    } catch (err) {
        toolList.innerHTML = '<p style="font-size:0.82rem; color:#7a1f1f;">Could not load tools.</p>';
    }
}

async function sendMessage() {
    const message = inputBox.value.trim();
    if (!message) return;

    errorBanner.style.display = 'none';
    addMessage(message, 'user');
    inputBox.value = '';
    sendBtn.disabled = true;
    orb.classList.add('thinking');

    const thinkingMsg = addMessage('...contemplating...', 'vaelor', 'thinking');

    try {
        const res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message })
        });

        if (!res.ok) {
            throw new Error('Server responded with status ' + res.status);
        }

        const data = await res.json();
        chat.removeChild(thinkingMsg);
        addMessage(data.response, 'vaelor', data.mode);

    } catch (err) {
        chat.removeChild(thinkingMsg);
        showError('Could not reach Vaelor: ' + err.message);
    }

    sendBtn.disabled = false;
    orb.classList.remove('thinking');
    inputBox.focus();
}

sendBtn.addEventListener('click', function(e) {
    e.preventDefault();
    sendMessage();
});

inputBox.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
    }
});

refreshBtn.addEventListener('click', function(e) {
    e.preventDefault();
    loadStatus();
    loadTools();
});

loadStatus();
loadTools();

console.log('[Vaelor UI] Script loaded, listeners attached.');
</script>

</body>
</html>
